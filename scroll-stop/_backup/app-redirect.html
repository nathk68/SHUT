<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHUT — Ouvrir dans l'app</title>
  <meta name="description" content="SHUT - Live DJ Streaming. Ouvre ce contenu dans l'app SHUT.">
  <meta property="og:title" content="SHUT - Live DJ Streaming">
  <meta property="og:description" content="Rejoins la communauté SHUT et regarde des DJs en live.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shutdiffusion.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #534e92;
      --accent-light: #7b74c8;
      --bg: #08080f;
      --text-primary: #f0eff4;
      --text-secondary: rgba(240, 239, 244, 0.55);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Archivo', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      text-align: center;
      max-width: 400px;
      padding: 48px 32px;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: white;
      letter-spacing: -1px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .store-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      text-decoration: none;
      font-family: 'Archivo', sans-serif;
      font-size: 15px;
      font-weight: 500;
      width: 260px;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }
    .store-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .store-btn svg { flex-shrink: 0; }
    .divider {
      margin: 24px 0;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .web-link {
      color: var(--accent-light);
      text-decoration: none;
      font-size: 14px;
    }
    .web-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>SHUT</h1>
    <p class="subtitle" id="message">Ouvre ce contenu dans l'app SHUT pour profiter de l'experience complete.</p>

    <div class="store-buttons">
      <a class="store-btn" id="ios-btn" href="#" style="display:none;">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="currentColor"><path d="M15.77 12.45c-.02-2.37 1.93-3.52 2.02-3.57-1.1-1.61-2.81-1.83-3.42-1.85-1.45-.15-2.85.86-3.59.86-.74 0-1.88-.85-3.1-.82-1.59.02-3.07.93-3.89 2.37-1.67 2.9-.43 7.18 1.19 9.53.8 1.15 1.74 2.44 2.98 2.4 1.2-.05 1.65-.77 3.1-.77 1.44 0 1.85.77 3.1.74 1.29-.02 2.1-1.17 2.88-2.32.92-1.33 1.29-2.63 1.31-2.7-.03-.01-2.51-.96-2.53-3.83l-.05.16zM13.4 5.12c.65-.8 1.09-1.9.97-3.01-.94.04-2.09.63-2.77 1.42-.6.7-1.14 1.83-.99 2.91 1.05.08 2.13-.53 2.79-1.32z"/></svg>
        App Store
      </a>
      <a class="store-btn" id="android-btn" href="#" style="display:none;">
        <svg width="20" height="22" viewBox="0 0 20 22" fill="currentColor"><path d="M1.21 0L11.05 10 1.21 20c-.38-.39-.21-1.26-.21-1.79V1.79C1 1.26.83.39 1.21 0zm.71-.41L13.06 5.5 3.5 10 1.92-.41zM13.06 14.5L1.92 20.41 3.5 10l9.56 4.5zm1.24-.73L19 11c.66.36.66 1.64 0 2l-4.7 2.77L10.5 12l3.8-3.23z"/></svg>
        Google Play
      </a>
    </div>

    <p class="divider">ou</p>
    <a class="web-link" href="https://shutdiffusion.com">Visiter shutdiffusion.com</a>
  </div>

  <script>
    (function() {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);

      // TODO: Replace with actual store URLs once the app is published
      var iosUrl = 'https://apps.apple.com/app/shut/idXXXXXXXXXX';
      var androidUrl = 'https://play.google.com/store/apps/details?id=com.nathk68.shutapp';

      var iosBtn = document.getElementById('ios-btn');
      var androidBtn = document.getElementById('android-btn');

      if (isIOS) {
        iosBtn.href = iosUrl;
        iosBtn.style.display = 'inline-flex';
      } else if (isAndroid) {
        androidBtn.href = androidUrl;
        androidBtn.style.display = 'inline-flex';
      } else {
        // Desktop: show both
        iosBtn.href = iosUrl;
        androidBtn.href = androidUrl;
        iosBtn.style.display = 'inline-flex';
        androidBtn.style.display = 'inline-flex';
      }

      // Customize message based on content type
      var path = window.location.pathname;
      var msgEl = document.getElementById('message');
      if (path.startsWith('/live/')) {
        msgEl.textContent = 'Ce live est disponible sur l\'app SHUT. Telecharge-la pour regarder en direct !';
      } else if (path.startsWith('/replay/')) {
        msgEl.textContent = 'Cette rediffusion est disponible sur l\'app SHUT. Telecharge-la pour ecouter !';
      } else if (path.startsWith('/profile/')) {
        msgEl.textContent = 'Decouvre ce profil sur l\'app SHUT. Telecharge-la pour suivre cet artiste !';
      }
    })();
  </script>
</body>
</html>
