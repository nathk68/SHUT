<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHUT Globe Preview</title>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; overflow: hidden; font-family: system-ui; }
  canvas { display: block; }
  #info {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.3); font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div id="info">SHUT Globe Animation Preview</div>
<script>
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let W, H, centerX, centerY, radius;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  centerX = W * 0.55;
  centerY = H * 0.5;
  radius = Math.min(W, H) * 0.32;
}
resize();
window.addEventListener('resize', resize);

const ACCENT_RGB = [102, 36, 131];

// --- Country outlines (loaded async) ---
let countryPolygons = []; // Array of arrays of {x,y,z} points

function latLonToSphere(lat, lon) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return {
    x: -Math.sin(phi) * Math.cos(theta),
    y: Math.cos(phi),
    z: Math.sin(phi) * Math.sin(theta),
  };
}

// Load world map data
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(world => {
    const countries = topojson.feature(world, world.objects.countries);
    for (const feature of countries.features) {
      const geom = feature.geometry;
      const coordSets = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;
      for (const polygon of coordSets) {
        for (const ring of polygon) {
          // Sample every Nth point for performance (110m is already simplified)
          const points = [];
          for (let i = 0; i < ring.length; i++) {
            const [lon, lat] = ring[i];
            points.push(latLonToSphere(lat, lon));
          }
          if (points.length > 2) {
            countryPolygons.push(points);
          }
        }
      }
    }
  });

// --- City hotspots ---
const cities = [
  { lat: 48.86, lon: 2.35 },
  { lat: 40.71, lon: -74.01 },
  { lat: 35.68, lon: 139.69 },
  { lat: -23.55, lon: -46.63 },
  { lat: 51.51, lon: -0.13 },
  { lat: 55.76, lon: 37.62 },
  { lat: 1.35, lon: 103.82 },
  { lat: -33.87, lon: 151.21 },
  { lat: 25.20, lon: 55.27 },
  { lat: 19.43, lon: -99.13 },
  { lat: 37.57, lon: 126.98 },
  { lat: -1.29, lon: 36.82 },
  { lat: 30.04, lon: 31.24 },
  { lat: 13.76, lon: 100.50 },
  { lat: 52.52, lon: 13.41 },
  { lat: 34.05, lon: -118.24 },
];

const cityPoints = cities.map(c => ({
  ...latLonToSphere(c.lat, c.lon),
  pulse: Math.random() * Math.PI * 2,
}));

// --- Arcs between city pairs ---
const arcs = [];
for (let i = 0; i < cityPoints.length; i++) {
  const j = (i + 1 + Math.floor(Math.random() * 3)) % cityPoints.length;
  arcs.push({ from: i, to: j, progress: Math.random(), speed: 0.003 + Math.random() * 0.004 });
}

// --- Floating sparkles ---
const SPARKLE_COUNT = 50;
const sparkles = [];
for (let i = 0; i < SPARKLE_COUNT; i++) {
  sparkles.push({
    angle: Math.random() * Math.PI * 2,
    elevation: (Math.random() - 0.5) * Math.PI * 0.8,
    dist: 1.08 + Math.random() * 0.35,
    speed: 0.0005 + Math.random() * 0.002,
    size: 1 + Math.random() * 2.5,
    phase: Math.random() * Math.PI * 2,
  });
}

// --- Rotation & mouse ---
let rotY = 0;
let mouseInfluenceX = 0;
let mouseInfluenceY = 0;
let targetMouseX = 0;
let targetMouseY = 0;

window.addEventListener('mousemove', (e) => {
  targetMouseX = ((e.clientX / W) - 0.5) * 0.3;
  targetMouseY = ((e.clientY / H) - 0.5) * 0.15;
});

function rotatePoint(p) {
  const ry = rotY + mouseInfluenceX;
  const rx = mouseInfluenceY;
  // Rotate Y
  let x = p.x * Math.cos(ry) + p.z * Math.sin(ry);
  let z = -p.x * Math.sin(ry) + p.z * Math.cos(ry);
  let y = p.y;
  // Rotate X
  const y2 = y * Math.cos(rx) - z * Math.sin(rx);
  const z2 = y * Math.sin(rx) + z * Math.cos(rx);
  return { x, y: y2, z: z2 };
}

function project(p) {
  const r = rotatePoint(p);
  return {
    x: centerX + r.x * radius,
    y: centerY - r.y * radius,
    z: r.z,
  };
}

function slerp(a, b, t) {
  const dot = Math.max(-1, Math.min(1, a.x * b.x + a.y * b.y + a.z * b.z));
  const omega = Math.acos(dot);
  if (omega < 0.001) return { x: a.x, y: a.y, z: a.z };
  const sinO = Math.sin(omega);
  const fa = Math.sin((1 - t) * omega) / sinO;
  const fb = Math.sin(t * omega) / sinO;
  return { x: a.x * fa + b.x * fb, y: a.y * fa + b.y * fb, z: a.z * fa + b.z * fb };
}

// --- Draw ---
let time = 0;

function draw() {
  time += 16;
  rotY += 0.002;
  mouseInfluenceX += (targetMouseX - mouseInfluenceX) * 0.05;
  mouseInfluenceY += (targetMouseY - mouseInfluenceY) * 0.05;

  ctx.clearRect(0, 0, W, H);

  // Subtle glow
  const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius * 1.5);
  glow.addColorStop(0, 'rgba(102, 36, 131, 0.06)');
  glow.addColorStop(0.5, 'rgba(102, 36, 131, 0.02)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // --- Draw country fills then outlines ---
  // Fill pass
  for (const poly of countryPolygons) {
    // Check if most of the polygon is visible
    let visCount = 0;
    for (let i = 0; i < poly.length; i += 3) {
      const r = rotatePoint(poly[i]);
      if (r.z > -0.05) visCount++;
    }
    if (visCount < poly.length / 6) continue;

    ctx.beginPath();
    let started = false;
    for (let i = 0; i < poly.length; i++) {
      const p = project(poly[i]);
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, 0.06)`;
    ctx.fill();
  }

  // Outline pass
  ctx.lineWidth = 0.6;
  for (const poly of countryPolygons) {
    ctx.beginPath();
    let drawing = false;
    for (let i = 0; i < poly.length; i++) {
      const p = project(poly[i]);
      if (p.z < -0.05) {
        drawing = false;
        continue;
      }
      const alpha = 0.04 + Math.max(0, p.z) * 0.18;
      if (!drawing) {
        if (ctx.strokeStyle !== 'skip') ctx.stroke();
        ctx.beginPath();
        ctx.strokeStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${alpha})`;
        ctx.moveTo(p.x, p.y);
        drawing = true;
      } else {
        ctx.lineTo(p.x, p.y);
      }
    }
    if (drawing) ctx.stroke();
  }

  // --- Draw arcs ---
  for (const arc of arcs) {
    arc.progress += arc.speed;
    if (arc.progress > 1) arc.progress = 0;

    const a = cityPoints[arc.from];
    const b = cityPoints[arc.to];

    const steps = 40;
    const points = [];
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const p = slerp(a, b, t);
      const lift = 1 + 0.15 * Math.sin(t * Math.PI);
      points.push(project({ x: p.x * lift, y: p.y * lift, z: p.z * lift }));
    }

    // Arc line
    ctx.beginPath();
    let anyVisible = false;
    for (const p of points) {
      if (p.z < -0.3) { anyVisible = false; continue; }
      if (!anyVisible) { ctx.moveTo(p.x, p.y); anyVisible = true; }
      else ctx.lineTo(p.x, p.y);
    }
    if (anyVisible) {
      ctx.strokeStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, 0.2)`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Traveling pulse
    const pulseIdx = Math.floor(arc.progress * steps);
    if (pulseIdx < points.length) {
      const pp = points[pulseIdx];
      if (pp.z > -0.1) {
        const pulseAlpha = 0.4 + pp.z * 0.5;
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${pulseAlpha})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(pp.x, pp.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${pulseAlpha * 0.2})`;
        ctx.fill();
      }
    }
  }

  // --- City hotspots ---
  for (const city of cityPoints) {
    const p = project(city);
    if (p.z < 0) continue;
    city.pulse += 0.03;
    const pulseScale = 1 + 0.3 * Math.sin(city.pulse);
    const alpha = 0.5 + p.z * 0.5;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 5 * pulseScale, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${alpha * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${alpha})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(180, 120, 220, ${alpha * 0.8})`;
    ctx.fill();
  }

  // --- Sparkles ---
  for (const s of sparkles) {
    s.angle += s.speed;
    s.elevation += Math.sin(time * 0.001 + s.phase) * 0.001;

    const x = Math.cos(s.angle) * Math.cos(s.elevation) * s.dist;
    const y = Math.sin(s.elevation) * s.dist;
    const z = Math.sin(s.angle) * Math.cos(s.elevation) * s.dist;

    const p = project({ x, y, z });
    const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.002 + s.phase));
    const alpha = twinkle * 0.6;

    ctx.beginPath();
    ctx.arc(p.x, p.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${alpha})`;
    ctx.fill();

    if (s.size > 1.8) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, s.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, ${alpha * 0.1})`;
      ctx.fill();
    }
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(centerX, centerY, radius * 1.02, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${ACCENT_RGB[0]}, ${ACCENT_RGB[1]}, ${ACCENT_RGB[2]}, 0.06)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
